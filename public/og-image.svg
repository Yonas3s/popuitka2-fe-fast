<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 158 H1200"/>
    <path d="M0 316 H1200"/>
    <path d="M0 474 H1200"/>
    <path d="M300 0 V630"/>
    <path d="M600 0 V630"/>
    <path d="M900 0 V630"/>
  </g>

  <!-- brand -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="330" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-2">unit-labs<tspan fill="#5b8def">_</tspan></text>
    <text x="80" y="400" fill="#a0a4b8" font-size="40" font-weight="400">Релиз-менеджмент для dev-команд</text>
    <text x="80" y="555" fill="#5b8def" font-size="24" font-weight="500">unit-labs.ru</text>
  </g>

  <!-- accent -->
  <rect x="80" y="430" width="60" height="4" fill="#5b8def"/>
</svg>
